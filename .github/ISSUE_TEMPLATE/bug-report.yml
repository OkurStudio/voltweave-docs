name: Bug report
description: Something in Voltweave does not behave as documented.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **This tracker is public. Everyone can read what you post.**
        Do not upload or paste your project files, your Fab or Epic license or purchase details, account names, e-mail addresses or other personal data. Do not post the plugin source code. Before you paste a log, remove your user name and other personal data from file paths.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Unreal Engine version and Voltweave version (Edit > Plugins).
      placeholder: "UE 5.8.x, Voltweave 0.2.0-rc.3"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - Editor
        - Play In Editor
        - Packaged game
        - Dedicated or listen server
        - Client
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest setup that shows it
      description: The nodes involved, their key properties and how they are wired. Describe it in words or with a few lines; do not attach project files.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics (optional)
      description: Output of Build > Check Map and of the console command Voltweave.Dump, and the relevant lines of the log (category LogVoltweave), with personal data removed.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included project files, license or purchase information, or personal data.
          required: true
