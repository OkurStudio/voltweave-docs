name: Documentation problem
description: A page is unclear, wrong or out of date.
title: "[Docs] "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        **This tracker is public.** Do not include project files, license or purchase information or personal data.
  - type: input
    id: page
    attributes:
      label: Page
      description: The address or the title of the page.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
